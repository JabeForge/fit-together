<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>FitTogether</title>
<style>body{margin:0;min-height:100svh;background:#111827;color:#fff;font:16px system-ui;display:grid;place-items:center}main{max-width:380px;text-align:center;padding:32px}img{border-radius:24px}p{color:#a8b4ca;line-height:1.6}button{background:#4f46e5;color:#fff;font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 24px;cursor:pointer}</style></head>
<body><main><img src="./icon-192.png" width="96" height="96" alt="FitTogether"><h1 id="title">You're offline</h1><p id="message">Connect to the internet to load your training, group and progress.</p><button id="retry" type="button">Try again</button></main>
<script>let de=(navigator.language||'').startsWith('de');try{const l=localStorage.getItem('fitTogether_language');if(l)de=l==='de';}catch{}if(de){document.documentElement.lang='de';document.getElementById('title').textContent='Du bist offline';document.getElementById('message').textContent='Verbinde dich mit dem Internet, um dein Training, deine Gruppe und deinen Fortschritt zu laden.';document.getElementById('retry').textContent='Erneut versuchen';}document.getElementById('retry').addEventListener('click',()=>location.reload());</script></body></html>
